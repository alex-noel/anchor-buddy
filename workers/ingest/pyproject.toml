[project]
name = "anchorbuddy-ingest"
version = "0.1.0"
requires-python = ">=3.11"
description = "Conservative NOAA ENC and reviewed-source regional pack ingestion"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.9,<4"]

[project.scripts]
anchor-ingest = "anchor_ingest.__main__:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anchor_ingest*"]
